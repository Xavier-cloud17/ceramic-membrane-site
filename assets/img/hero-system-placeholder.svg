<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">成套膜系统占位图</title>
  <desc id="desc">工业厂区中的膜分离成套装置和数字化蓝图效果，用于替换为真实工程项目照片。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1c5d74"/>
      <stop offset=".48" stop-color="#09273e"/>
      <stop offset="1" stop-color="#071421"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".35" fill="#b9d1d7">
